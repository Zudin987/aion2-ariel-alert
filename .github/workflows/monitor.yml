name: Ariel Character Creation Monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check website / monitor & notify / test Discord"
        required: true
        type: choice
        default: check
        options:
          - check
          - monitor
          - test-alert

permissions:
  contents: write

concurrency:
  group: ariel-character-creation
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check Ariel status
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'monitor' }}
        run: |
          case "$RUN_MODE" in
            test-alert) python monitor.py --test-alert ;;
            check) python monitor.py --check ;;
            monitor) python monitor.py ;;
            *) echo 'Unknown mode'; exit 2 ;;
          esac
      - name: Save state if changed
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'monitor') }}
        run: |
          if git diff --quiet -- state.json; then
            echo 'No state change'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m 'chore: record Ariel creation status [skip ci]'
          git push
